[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looped-cartan"
version = "0.1.0"
description = "Weight-tied 2-Block Alternating Port-Hamiltonian Language Model (LoopedCartanLM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubham Barmase (shu195)" }]
dependencies = [
    "torch>=2.1.0",
    "datasets>=2.14.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["looped_cartan*"]
